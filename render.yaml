projects:
  - name: gram-sandesh
    environments:
      - name: production
        services:
          - type: web
            name: gram-sandesh
            runtime: docker
            plan: free
            region: singapore
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: commit
            healthCheckPath: /api/health
            envVars:
              - key: SPRING_PROFILES_ACTIVE
                value: render
              - key: DATABASE_URL
                fromDatabase:
                  name: gram-sandesh-db
                  property: connectionString
              - key: GRAM_SANDESH_ADMIN_PASSWORD
                sync: false
        databases:
          - name: gram-sandesh-db
            databaseName: gram_sandesh
            plan: free
            region: singapore
